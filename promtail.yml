server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock

    relabel_configs:
      # Extrai nome do container como label (remove a "/" inicial do nome Docker)
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: /(.*)
        replacement: $1

    pipeline_stages:
      # Desempacota o envelope Docker: {"log": "...", "stream": "...", "time": "..."}
      # Após este stage, a linha do log é o JSON da app
      - docker: {}

      # Parseia JSON da app e extrai campos para o mapa interno do Promtail
      # Containers que não emitem JSON passam como texto bruto (sem labels), não são descartados
      - json:
          expressions:
            service: service
            level: level
            stage: stage
            message: message

      # Promove campos para labels Loki (baixa cardinalidade apenas)
      # NÃO adicionar: conversation_id, phone_number (alta cardinalidade)
      - labels:
          service:
          level:
          stage:

      # Define a mensagem final exibida no Grafana Explore
      # "message" refere-se ao campo extraído pelo stage json acima
      - output:
          source: message
